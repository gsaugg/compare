version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'npm'
    groups:
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      # @sveltejs/kit doesn't support TS 7 yet (Go rewrite, no stable API).
      # Expected fix in TS 7.1 (~Oct 2026). Remove this when kit supports it.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  # Python dependencies (uv/pip)
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'pip'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'actions'
    groups:
      github-actions:
        patterns: ['*']
