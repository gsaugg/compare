name: Update Product Data

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'stores.json'
  workflow_dispatch:
    inputs:
      use_tailscale:
        description: 'Route through Tailscale exit node'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: scrape
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Tailscale
        if: github.event.inputs.use_tailscale == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gsaugg-compare

      - name: Run scraper via exit node
        if: github.event.inputs.use_tailscale == 'true'
        run: |
          sudo tailscale set --exit-node=simnas
          echo "Routing through: $(curl -s ifconfig.me)"
          uv run python scripts/scrape.py
          sudo tailscale set --exit-node=

      - name: Run scraper directly
        if: github.event.inputs.use_tailscale != 'true'
        run: |
          echo "Running directly from: $(curl -s ifconfig.me)"
          uv run python scripts/scrape.py

      - name: Commit and push if changed
        id: commit
        env:
          MAX_RETRIES: 3
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/ .cache/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Stash our data changes (not committed yet)
          # Strategy: always push on top of latest remote — no rebase needed
          # since cancel-in-progress ensures only one scrape runs at a time
          for i in $(seq 1 "$MAX_RETRIES"); do
            echo "Push attempt $i/$MAX_RETRIES..."

            # Reset to latest remote main, then re-apply our data on top
            git reset HEAD -- .  # unstage
            git stash --include-untracked
            git fetch origin main
            git reset --hard origin/main
            git stash pop
            git add public/data/ .cache/
            git commit -m "Update product data"

            if timeout 30 git push; then
              echo "changed=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Push rejected, retrying..."
            sleep 5
          done

          echo "::error::Failed to push after $MAX_RETRIES attempts"
          exit 1

  build:
    runs-on: ubuntu-latest
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://www.gsau.gg/data/products.json",
              "https://www.gsau.gg/data/items.json",
              "https://www.gsau.gg/data/tracker-data.json",
              "https://www.gsau.gg/data/item-history.json",
              "https://www.gsau.gg/data/stats.json"
            ]}'
